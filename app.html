.app.col .cb .ic{transform:rotate(180deg)}

 .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-102%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.4)}.side.open{transform:none}

}

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyAmqSz709-jRC-3jKTqXJR_b26VXftwjGje9lvH5KlcgT9xWuQI1cMBO3G5GltRcqJVw/exec';
const METHODS = ['TD','KS','WWC','FGD','ANL','OBS','PJ'], MNAME={TD:'Tinjauan Dokumentasi',KS:'Kuesioner',WWC:'Wawancara',FGD:'FGD',ANL:'Analisis',OBS:'Observasi',PJ:'Pengujian'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Dasar','Reaktif','Terencana','Proaktif','Resilient'];
const cat=(x,th)=>{x=Math.round(x*1e4)/1e4;for(let i=0;i<4;i++)if(x<th[i])return CATS[i];return CATS[4]};
const chip=c=>`<span class="chip ${c}">${c}</span>`;
let KEY='',ROLE='',D=null,TAB='hasil',DIRTY={},OVR_DIRTY={},METHOD='TD',INDF='1';
let SCOPE='*',CUSTOM=[];try{SCOPE=sessionStorage.getItem('sml_scope')||'*';CUSTOM=JSON.parse(sessionStorage.getItem('sml_custom')||'[]')}catch(e){}
const DEF={agg:'MIN',itemrule:'MIN',ksround:'Pembulatan biasa',minresp:'1',moe:'0.05',perusahaan:'',periode:''};

async function call(body){try{const r=body?await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,key:KEY})}):await fetch(`${API_URL}?action=all&key=${encodeURIComponent(KEY)}`);return await r.json()}catch(e){return{ok:false,error:'Tidak dapat terhubung ke server'}}}
function prep(X){X.cfg={...DEF};X.Config.forEach(c=>X.cfg[c.kunci]=String(c.nilai));
  X.skor={};X.cat={};X.Skor.forEach(r=>{const k=`${r.item}|${r.metode}|${r.entitas}`;if(r.entitas==='_CAT')X.cat[`${r.item}|${r.metode}`]=r.catatan;else if(r.skor!=='')X.skor[k]=Number(r.skor)});
  X.ovrAll=X.Override.map(r=>({item:String(r.item),skor:Number(r.skor),alasan:r.alasan,iup:String(r.iup||'')}));
  X.lap={};(X.Laporan||[]).forEach(r=>{try{(X.lap[r.iup]=X.lap[r.iup]||{})[r.kunci]=JSON.parse(r.nilai)}catch(e){}});return X}
/* override: berlaku untuk semua cakupan (iup kosong) atau untuk satu IUP; cakupan IUP memakai override IUP-nya lebih dulu */
const ovrFor=code=>{const sc=SCOPE.startsWith('iup:')?SCOPE.slice(4):'';const a=D.ovrAll.filter(o=>o.item===code);return a.find(o=>sc&&o.iup===sc)||a.find(o=>!o.iup)||null};
async function load(){const r=await call();if(!r.ok)return r;ROLE=r.role;D=prep(r.data);return r}
const withData=(X,fn)=>{const o=D;D=X;try{return fn()}finally{D=o}};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const backupJson=()=>JSON.stringify({Entitas:D.Entitas,Populasi:D.Populasi,Skor:D.Skor,Override:D.ovrAll.map(o=>({item:o.item,skor:o.skor,alasan:o.alasan,iup:o.iup})),Config:D.Config,KS_Rekap:D.KS_Rekap,Temuan:D.Temuan,Program:D.Program,Laporan:D.Laporan||[]},null,1);

/* ===== Perhitungan sesuai Kepdirjen: satu skor per item; parameter = Σ skor item /(5×n item) × bobot ===== */
const indukList=e=>String(e.induk||'').split(',').map(x=>x.trim()).filter(Boolean);
const allEnt=()=>D.Entitas.filter(e=>e.aktif==='Ya');
/* Cakupan penilaian: '*' = seluruh grup; 'iup:KODE' = satu IUP + kontraktor/vendor yang bekerja untuknya; 'custom' = pilihan manual */
function activeEnt(){const all=allEnt();
  if(SCOPE.startsWith('iup:')){const k=SCOPE.slice(4);return all.filter(e=>e.kode===k||(e.peran!=='IUP'&&(!indukList(e).length||indukList(e).includes(k))))}
  if(SCOPE==='custom'){const r=all.filter(e=>CUSTOM.includes(e.kode));return r.length?r:all}
  return all}
const scopeName=()=>{if(SCOPE==='*')return'Seluruh grup';if(SCOPE==='custom')return'Pilihan manual';const e=D.Entitas.find(x=>x.kode===SCOPE.slice(4));return e?e.nama+' + kontraktor/vendornya':SCOPE}
function ksScores(){ // {entitas: {item: skor}} dari rekap kuesioner
  const min=+D.cfg.minresp||1,res={};
  activeEnt().forEach(e=>{res[e.kode]={};KS_ITEMS_M.forEach(it=>{const sc=[];
    D.KS_Rekap.filter(g=>g.entitas===e.kode&&it.levels.includes(g.level.toUpperCase())&&g.n>=min&&g.cnt[it.code]>0).forEach(g=>{const a=g.sum[it.code]/g.cnt[it.code];sc.push(D.cfg.ksround==='Dibulatkan ke bawah'?Math.floor(a):Math.round(a))});
    if(sc.length)res[e.kode][it.code]=Math.min(...sc)})});return res}
let KS_ITEMS_M=MASTER.items.filter(i=>i.methods.includes('KS'));
function entScore(it,m,e,ks){return m==='KS'?ks[e.kode]?.[it.code]:D.skor[`${it.code}|${m}|${e.kode}`]}
function consolidate(it,m,ents,ks){
  const el=(it.iup?ents.filter(e=>e.peran==='IUP'):ents),v=[];
  el.forEach(e=>{const s=entScore(it,m,e,ks);if(s>=1)v.push({s,w:+e.pekerja||0})});
  if(!v.length)return null;
  if(D.cfg.agg==='MIN'||ents.length===1)return Math.min(...v.map(x=>x.s));
  const sw=v.reduce((a,x)=>a+x.w,0);return sw?v.reduce((a,x)=>a+x.s*x.w,0)/sw:v.reduce((a,x)=>a+x.s,0)/v.length}
function itemFinal(it,ents,ks,useOvr){
  const ms={};it.methods.forEach(m=>ms[m]=consolidate(it,m,ents,ks));
  const vals=Object.values(ms).filter(x=>x!=null);let f=null,ov=false;
  const o=useOvr?ovrFor(it.code):null;if(o){f=o.skor;ov=true}
  else if(vals.length)f=D.cfg.itemrule==='MIN'?Math.min(...vals):Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  return{ms,f,ov,comp:ov?1:vals.length/it.methods.length}}
function calc(ents,ks,useOvr=true){
  const R={items:{},params:{},inds:{},total:0};
  MASTER.items.forEach(it=>{if(it.iup&&!ents.some(e=>e.peran==='IUP'))return;R.items[it.code]=itemFinal(it,ents,ks,useOvr)});
  let tw=0,tc=0,tn=0;
  Object.keys(MASTER.params).forEach(p=>{const its=MASTER.items.filter(i=>i.param===p&&R.items[i.code]);
    const sum=its.reduce((a,i)=>a+(R.items[i.code].f||0),0),n=its.length,w=MASTER.params[p].w,pct=n?sum/(5*n):0;
    const comp=n?its.reduce((a,i)=>a+R.items[i.code].comp,0)/n:0;
    R.params[p]={name:MASTER.params[p].name,w,n,sum,pct,cap:pct*w,gap:w-pct*w,cat:cat(pct,MASTER.th_item),comp}});
  [1,2,3,4].forEach(i=>{const ps=Object.keys(R.params).filter(p=>p.startsWith(i+'.'));const cap=ps.reduce((a,p)=>a+R.params[p].cap,0),mx=ps.reduce((a,p)=>a+R.params[p].w,0);
    const comp=ps.reduce((a,p)=>a+R.params[p].comp*R.params[p].n,0)/ps.reduce((a,p)=>a+R.params[p].n,0);
    R.inds[i]={name:MASTER.ind[i],cap,mx,pct:cap/mx,cat:cat(cap,MASTER.th_ind[i]),comp};R.total+=cap;tw+=mx;tc+=comp*mx});
  R.cat=cat(R.total,MASTER.th_tot);R.comp=tc/tw;return R}

/* ===== Tampilan ===== */
const ICON={hasil:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',banding:'<path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4M17 17l-3-3M17 17l-3 3"/>',nilai:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',ks:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',lap:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',dok:'<path d="M4 4h12l4 4v12H4zM8 12h8M8 16h5M8 8h4"/>',ekspor:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',ent:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-2.5-1.500-4.500-4-5.500"/>',arsip:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',logo:'<path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]||''}</svg>`;

async function saveScores(){
  const rows=Object.entries(DIRTY).map(([k,v])=>{if(k.startsWith('c:')){const[i,m]=k.slice(2).split('|');return{item:i,metode:m,entitas:'_CAT',skor:'',catatan:v}}const[i,m,e]=k.split('|');return{item:i,metode:m,entitas:e,skor:v,catatan:''}});
  if(!rows.length)return;$('#sv').disabled=true;$('#sm').textContent='Menyimpan…';
  for(let i=0;i<rows.length;i+=150){const r=await call({action:'saveScores',rows:rows.slice(i,i+150)});if(!r.ok){$('#sm').innerHTML=`<span class="er">${esc(r.error)}</span>`;$('#sv').disabled=false;return}}
  rows.forEach(r=>{if(r.entitas==='_CAT')D.cat[`${r.item}|${r.metode}`]=r.catatan;else{const k=`${r.item}|${r.metode}|${r.entitas}`;if(r.skor==='')delete D.skor[k];else D.skor[k]=r.skor}});
  DIRTY={};$('#sv').disabled=false;$('#sm').innerHTML='<span class="ok">Tersimpan.</span>'}

function vKs(){
  const ents=activeEnt(),sl=(N,e)=>Math.ceil(N/(1+N*e*e)),moe=+D.cfg.moe||.05;
  const pop={};D.Populasi.forEach(p=>pop[p.entitas+'|'+p.level]=+p.populasi||0);
  const lv=['Top Management','Top Management Site','Middle Management','Pengawas','Non Staff'];
  const cnt={};D.KS_Rekap.forEach(g=>cnt[g.entitas+'|'+g.level]=g.n);
  let tg=0,tn=0,tw=0;
  const body=ents.map(e=>lv.map(l=>{const N=pop[e.kode+'|'+l]||0,t=N?sl(N,moe):0,n=cnt[e.kode+'|'+l]||0;tg+=t;tn+=Math.min(n,t||n);tw+=t?Math.ceil(t/10):0;
    return`<tr><td>${esc(e.kode)}</td><td>${l}</td><td class="n">${ROLE==='admin'?`<input type="number" min="0" style="width:80px" data-p="${e.kode}|${l}" value="${N}">`:N}</td><td class="n">${t}</td><td class="n">${n}</td><td class="n ${t&&n>=t?'ok':'er'}">${t?Math.round(n/t*100)+'%':'-'}</td><td class="n">${t?Math.ceil(t/10):'-'}</td></tr>`}).join('')).join('');
  $('#v').innerHTML=`<div class="c"><h2>Rekap kuesioner (anonim)</h2><div class="mu">Sampel = N / (1 + N·e²), e = ${(moe*100).toFixed(0)}%. Saran narasumber WWC/FGD = 10% dari target sampel tiap kelompok (dibulatkan ke atas), mengikuti acuan lembar SAMPLING; angka ini dan sampel KS otomatis masuk ke tabel “Metode dan Sampel” di laporan Word. Jawaban individual tidak ditampilkan di aplikasi ini.</div>
   ${ROLE==='admin'?'<div class="row"><button id="sp">Simpan populasi</button><span id="pm" class="mu"></span></div>':''}
   <div class="sc"><table><tr><th>Entitas</th><th>Level</th><th class="n">Populasi (N)</th><th class="n">Target sampel</th><th class="n">Terkumpul</th><th class="n">%</th><th class="n">Saran narasumber WWC/FGD</th></tr>${body}<tr><th colspan="3">Total</th><th class="n">${tg}</th><th class="n">${tn}</th><th class="n">${tg?Math.round(tn/tg*100)+'%':'-'}</th><th class="n">${tw}</th></tr></table></div></div>${ROLE==='admin'?'<div class="c" id="pg"></div>':''}`;
  if(ROLE==='admin')pengisianUI();
