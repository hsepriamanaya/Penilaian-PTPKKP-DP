<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyAmqSz709-jRC-3jKTqXJR_b26VXftwjGje9lvH5KlcgT9xWuQI1cMBO3G5GltRcqJVw/exec';
const METHODS = ['TD','KS','WWC','FGD','ANL','OBS','PJ'], MNAME={TD:'Tinjauan Dokumentasi',KS:'Kuesioner',WWC:'Wawancara',FGD:'FGD',ANL:'Analisis',OBS:'Observasi',PJ:'Pengujian'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Dasar','Reaktif','Terencana','Proaktif','Resilient'];
const cat=(x,th)=>{x=Math.round(x*1e4)/1e4;for(let i=0;i<4;i++)if(x<th[i])return CATS[i];return CATS[4]};
const chip=c=>`<span class="chip ${c}">${c}</span>`;
let NOTES_ALL=false,KEY='',ROLE='',D=null,TAB='hasil',DIRTY={},OVR_DIRTY={},METHOD='TD',INDF='1';
let SCOPE='*',CUSTOM=[];try{SCOPE=sessionStorage.getItem('sml_scope')||'*';CUSTOM=JSON.parse(sessionStorage.getItem('sml_custom')||'[]')}catch(e){}
const LVALL=['Top Management','Top Management Site','Middle Management','Pengawas','Non Staff'];
const lvOff=ent=>{const v=typeof ent==='string'?D.cfg['lvloff_'+ent]:undefined,s=(v===undefined||v==='*')?D.cfg.lvloff:(v==='-'?'':v);return String(s||'').split(',').map(x=>x.trim()).filter(Boolean)},lvOn=(l,ent)=>!lvOff(ent).includes(l),cfgRows=()=>Object.keys(D.cfg).map(k=>({kunci:k,nilai:D.cfg[k]}));
const DEF={lvloff:'',agg:'MIN',itemrule:'MIN',ksround:'Pembulatan biasa',minresp:'1',moe:'0.05',perusahaan:'',periode:''};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Semua aksi simpan bersifat upsert/replace (idempoten) sehingga aman diulang. Diulang hingga 3x bila jaringan putus,
   server membalas non-JSON (kuota/timeout Apps Script), atau server sedang dikunci auditor lain ("Lock"). 'arsipkan' tidak diulang. */
async function call(body){
  const tries=body&&body.action==='arsipkan'?1:3;
  for(let i=0;i<tries;i++){
    const last=i===tries-1,ct=new AbortController(),to=setTimeout(()=>ct.abort(),90000);
    try{
      const r=body?await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,key:KEY}),signal:ct.signal}):await fetch(`${API_URL}?action=all&key=${encodeURIComponent(KEY)}`,{signal:ct.signal});
      const j=await r.json();clearTimeout(to);
      if(j&&j.ok===false&&/lock|sedang sibuk|try again/i.test(j.error||'')&&!last){await sleep(1500*(i+1));continue}
      return j}
    catch(e){clearTimeout(to);if(last)return{ok:false,error:'Tidak dapat terhubung ke server (sudah dicoba '+tries+'x). Periksa koneksi lalu simpan lagi.'};await sleep(1200*(i+1))}}}
const ovKey=o=>o.item+'|'+(o.iup||''),ovSnap=a=>{const m={};a.forEach(o=>m[ovKey(o)]=JSON.stringify([+o.skor,o.alasan||'']));return m};
function prep(X){X.cfg={...DEF};X.Config.forEach(c=>X.cfg[c.kunci]=String(c.nilai));
  X.skor={};X.cat={};X.Skor.forEach(r=>{const k=`${r.item}|${r.metode}|${r.entitas}`;if(r.entitas==='_CAT')X.cat[`${r.item}|${r.metode}`]=r.catatan;else if(r.skor!=='')X.skor[k]=Number(r.skor)});
  X.wwc=(X.Wawancara||[]).map(r=>({...r,peserta:+r.peserta||1,skor:wParse(r.skor),catatan:wParse(r.catatan)}));X.ovrAll=X.Override.map(r=>({item:String(r.item),skor:Number(r.skor),alasan:r.alasan,iup:String(r.iup||'')}));
  X.lap={};(X.Laporan||[]).forEach(r=>{try{(X.lap[r.iup]=X.lap[r.iup]||{})[r.kunci]=JSON.parse(r.nilai)}catch(e){}});X.cfg0={...X.cfg};X.ovr0=ovSnap(X.ovrAll);if(typeof derivePop==='function')derivePop(X);return X}
/* override: berlaku untuk semua cakupan (iup kosong) atau untuk satu IUP; cakupan IUP memakai override IUP-nya lebih dulu */
const ovrFor=code=>{const sc=SCOPE.startsWith('iup:')?SCOPE.slice(4):'';const a=D.ovrAll.filter(o=>o.item===code);return a.find(o=>sc&&o.iup===sc)||a.find(o=>!o.iup)||null};
let SAVING=0,SAVING_SC=false;
const hasUnsaved=()=>Object.keys(DIRTY).length>0||SAVING>0||(typeof WDIRTY!=='undefined'&&WDIRTY)||(typeof DOK_DIRTY!=='undefined'&&DOK_DIRTY)||(typeof DK!=='undefined'&&DK.dirty);
/* Bilah status simpan yang tetap terlihat di semua menu, supaya tidak ada simpan yang berjalan/gagal tanpa diketahui */
function savebar(){let b=document.getElementById('sbar');if(!b){b=document.createElement('div');b.id='sbar';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:99;max-width:360px;padding:10px 14px;border-radius:10px;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;background:var(--c1,#fff);color:var(--tx,#111);border:1px solid var(--bd,#ccc)';document.body.appendChild(b)}return b}
function sbar(msg,kind,ms){const b=savebar();clearTimeout(b._t);if(!msg){b.style.display='none';return}b.textContent=msg;b.style.display='block';b.style.borderColor=kind==='er'?'#dc2626':kind==='ok'?'#16a34a':'';b.style.color=kind==='er'?'#dc2626':'';if(ms)b._t=setTimeout(()=>sbar(''),ms)}
const smSet=h=>{const e=$('#sm');if(e)e.innerHTML=h};
/* Pengaturan: hanya kunci yang berubah yang dikirim dan digabung di server, sehingga dua auditor tidak saling menimpa. Code.gs lama → cadangan simpan penuh. */
async function cfgSave(){
  const b=D.cfg0||{},ch=Object.keys(D.cfg).filter(k=>String(D.cfg[k])!==String(b[k]??'')).map(k=>({kunci:k,nilai:D.cfg[k]}));
  let r=ch.length?await call({action:'mergeConfig',rows:ch}):{ok:true};
  if(!r.ok&&/tidak dikenal/i.test(r.error||''))r=await call({action:'saveConfig',rows:cfgRows()});
  if(r.ok)D.cfg0={...D.cfg};return r}
/* Override: kirim hanya baris yang ditambah/diubah dan yang dihapus (bukan seluruh tabel). */

async function saveScores(){
  if(SAVING_SC)return;
  const snap={...DIRTY},keys=Object.keys(snap);if(!keys.length)return;
  const rows=keys.map(k=>{const v=snap[k];if(k.startsWith('c:')){const[i,m]=k.slice(2).split('|');return{item:i,metode:m,entitas:'_CAT',skor:'',catatan:v,_k:k}}const[i,m,e]=k.split('|');return{item:i,metode:m,entitas:e,skor:v,catatan:'',_k:k}});
  SAVING_SC=true;SAVING++;const sv=$('#sv');if(sv)sv.disabled=true;smSet('Menyimpan…');sbar('Menyimpan penilaian… jangan tutup halaman','');
  let fail='';
  try{
    for(let i=0;i<rows.length;i+=150){
      const part=rows.slice(i,i+150),r=await call({action:'saveScores',rows:part.map(({_k,...x})=>x)});
      if(!r.ok){fail=r.error||'Gagal menyimpan';break}
      part.forEach(x=>{if(x.entitas==='_CAT')D.cat[`${x.item}|${x.metode}`]=x.catatan;else{const k=`${x.item}|${x.metode}|${x.entitas}`;if(x.skor==='')delete D.skor[k];else D.skor[k]=x.skor}
        if(DIRTY[x._k]===snap[x._k])delete DIRTY[x._k]})}   /* edit yang dibuat SAAT menyimpan tetap tersisa & akan disimpan berikutnya */
  }catch(e){fail=String(e.message||e)}
  SAVING_SC=false;SAVING--;const left=Object.keys(DIRTY).length,sv2=$('#sv');if(sv2)sv2.disabled=false;
  if(fail){smSet(`<span class="er">${esc(fail)}</span>`);sbar('Gagal menyimpan penilaian: '+fail+'. Data masih di layar; buka menu Penilaian lalu klik Simpan lagi.','er')}
  else{smSet(left?left+' perubahan belum disimpan':'<span class="ok">Tersimpan.</span>');sbar(left?left+' perubahan baru belum disimpan':'Penilaian tersimpan','ok',left?0:2500);if(left&&TAB!=='nilai')saveScores()}}

let _idle;const _rst=()=>{clearTimeout(_idle);if(KEY)_idle=setTimeout(()=>{if(KEY&&!hasUnsaved())logout(true);else _rst()},30*60*1000)};
['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,_rst,{passive:true}));
function login(msg=''){
  $('#app').innerHTML=`<div class="lg"><div class="lc"><div class="mk">${MARK}</div><h2>SML · PTPKKP</h2><div class="mu" style="margin:4px 0 16px">Aplikasi penilaian tingkat pencapaian kinerja keselamatan pertambangan. Masukkan kunci akses dari koordinator (auditor = kunci admin, KTT/manajemen = kunci baca).</div><input id="k" type="password" placeholder="Kunci akses" autocomplete="current-password"><button id="go">Masuk</button><div class="er" style="margin-top:10px;min-height:1.2em">${esc(msg)}</div><div style="margin-top:12px"><a href="index.html">← Kembali ke beranda</a></div></div></div>`;
  $('#go').onclick=async()=>{KEY=$('#k').value.trim();$('#go').disabled=true;const r=await load();if(!r.ok){login(r.error||'Gagal');return}try{sessionStorage.setItem('sml_key',KEY)}catch(e){}_rst();shell()};
  $('#k').onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}
(async()=>{if(API_URL.startsWith('GANTI'))return $('#app').innerHTML='<div class="c er">API_URL belum diisi (lihat PANDUAN).</div>';
  try{KEY=sessionStorage.getItem('sml_key')||''}catch(e){}
  if(KEY){const r=await load();if(r.ok)return shell()}login()})();
</script></body></html>
